<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rover Telemetry Interface</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Using ?v=6 to ensure the browser fetches the latest version of your CSS -->
    <link rel="stylesheet" href="/static/style.css?v=6">
</head>
<body>
    <div class="rover-container">
        
        <div class="dashboard-header">
            <div class="title-glow"><i class="fas fa-satellite-dish"></i> ROVER COMMAND UPLINK</div>
            <div>STATUS: <span style="color: #00ffcc;">ONLINE</span> | SIGNAL: <span style="color: #00ffcc;">STRONG</span></div>
        </div>

        <div class="monitor-wrapper">
            
            <img src="/video_feed" alt="Rover Camera Feed" class="camera-feed" id="camera-stream">

            <!-- Telemetry Zone -->
            <div class="hud-top-left">
                <div class="telemetry-line">
                    <span class="telemetry-label">TEMP:</span>
                    <span class="telemetry-value"><span id="temp-val">--</span>°C</span>
                </div>
                <div class="telemetry-line">
                    <span class="telemetry-label">HUMI:</span>
                    <span class="telemetry-value"><span id="humi-val">--</span>%</span>
                </div>
                <div class="telemetry-line">
                    <span class="telemetry-label">GAS:</span>
                    <span class="telemetry-value"><span id="gas-val">--</span></span>
                </div>
                <div class="telemetry-line">
                    <span class="telemetry-label">DUST:</span>
                    <span class="telemetry-value"><span id="dust-val">--</span></span>
                </div>
            </div>

            <div class="hud-top-right">
                <div class="rec-indicator">● REC</div>
            </div>

            <div class="crosshair"></div>

            <!-- AI Diagnostics Zone -->
            <div class="hud-bottom-left">
                <div class="box-title-amber"><i class="fas fa-microchip"></i> AI DIAGNOSTICS</div>
                <div class="box-content" id="ai-output" style="font-size: 1.1rem; padding-top: 5px;">
                    <div style="margin-bottom: 5px; color: #8faebf;">
                        PERSONS: <span id="person-count" style="color: #00ff00; font-weight: bold; padding-left: 10px;">0</span>
                    </div>
                    <div style="color: #8faebf;">
                        MINERS: <span id="miner-count" style="color: #ffaa00; font-weight: bold; padding-left: 18px;">0</span>
                    </div>
                </div>
            </div>

            <div class="hud-bottom-right">
                <div class="box-title-cyan">VISION TRACKING <i class="fas fa-eye"></i></div>
                <div class="box-content" id="vision-output">
                    [STANDBY] Awaiting target data.
                </div>
            </div>

        </div>
    </div>

    <!-- Using ?v=6 to ensure the browser fetches the latest version of your JS -->
    <script src="/static/script.js?v=6"></script>
</body>
</html>
