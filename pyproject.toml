[project]
name = "sih"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "elevenlabs>=2.65.0",
    "flask>=3.1.3",
    "joblib>=1.5.3",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pyaudio>=0.2.14",
    "pykalman>=0.11.2",
    "pymongo>=4.17.0",
    "pyserial>=3.5",
    "scapy>=2.7.0",
    "scikit-learn>=1.9.0",
    "tensorflow>=2.21.0",
    "ultralytics>=8.4.135",
]

[project.scripts]
sih = "sih:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
